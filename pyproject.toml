[tool.ruff]
line-length = 120
# alembic/versions is generated by Alembic, and data/ holds run output
extend-exclude = ["alembic/versions", "data"]

[tool.ruff.lint]
# F finds unused and undefined names, N checks names are snake_case, B finds likely bugs
select = ["F", "N", "B"]
ignore = [
    # FastAPI reads Depends(...) from default arguments, so every route is written this way
    "B008",
    # About 60 routes raise HTTPException inside an except block without "from". They have no tests yet,
    # so they are left for a separate change instead of editing them all blind here.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# These import every model so SQLAlchemy can resolve the relationships between them.
"control_plane/app/models/__init__.py" = ["F401"]
"worker/app/__init__.py" = ["F401"]
# Alembic reads the models from Base.metadata, so these imports have to stay for autogenerate to see the tables.
"alembic/env.py" = ["F401"]
