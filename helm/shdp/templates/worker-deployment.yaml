apiVersion: apps/v1
kind: Deployment
metadata:
  name: shdp-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: shdp-worker
  template:
    metadata:
      # a change to the config or the secrets changes these, so Kubernetes replaces the pods. Without them a new value
      # would sit in the ConfigMap while the pods kept running with the old one.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: shdp-worker
    spec:
      # On SIGTERM the worker finishes the run it has, then exits (worker/app/main.py). Kubernetes waits this long
      # before it kills the pod. A run that is not finished by then is taken back by the reaper once its lease runs out.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: shdp-config
            - secretRef:
                name: shdp-secrets
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
