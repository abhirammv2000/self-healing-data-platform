apiVersion: apps/v1
kind: Deployment
metadata:
  name: shdp-control-plane
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      app: shdp-control-plane
  template:
    metadata:
      # a change to the config or the secrets changes these, so Kubernetes replaces the pods. Without them a new value
      # would sit in the ConfigMap while the pods kept running with the old one.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: shdp-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.controlPlane.port }}
          envFrom:
            - configMapRef:
                name: shdp-config
            - secretRef:
                name: shdp-secrets
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          # ready = Postgres and Redis answer (/ready). A pod that is not ready gets no traffic but is not restarted
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.controlPlane.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          # alive = the process answers (/health). It does not look at Postgres or Redis: a database outage must not
          # restart every pod
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.controlPlane.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: shdp-control-plane
spec:
  selector:
    app: shdp-control-plane
  ports:
    - port: 80
      targetPort: {{ .Values.controlPlane.port }}
  # ClusterIP, not LoadBalancer: a LoadBalancer Service on EKS provisions an AWS ELB/NLB
  # outside Terraform's state, so it must be deleted (helm uninstall) before terraform
  # destroy or it's orphaned and keeps billing. See helm/shdp/README.md.
  type: ClusterIP
