apiVersion: v1
kind: Secret
metadata:
  name: shdp-secrets
type: Opaque
stringData:
  # Every key is required at deploy time via a separate, gitignored secrets values file
  # (helm install -f secrets.local.yaml); no committed defaults. See helm/shdp/README.md.
  DATABASE_URL: {{ required "secrets.databaseUrl is required (postgresql+asyncpg://...)" .Values.secrets.databaseUrl | quote }}
  DATABASE_URL_SYNC: {{ required "secrets.databaseUrlSync is required" .Values.secrets.databaseUrlSync | quote }}
  DATA_WAREHOUSE_URL: {{ required "secrets.dataWarehouseUrl is required" .Values.secrets.dataWarehouseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | quote }}
  API_KEY_SECRET: {{ required "secrets.apiKeySecret is required" .Values.secrets.apiKeySecret | quote }}
  ADMIN_SECRET_KEY: {{ required "secrets.adminSecretKey is required" .Values.secrets.adminSecretKey | quote }}
  GOOGLE_API_KEY: {{ required "secrets.googleApiKey is required" .Values.secrets.googleApiKey | quote }}
