name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        # rules and exceptions are in pyproject.toml, including the snake_case name check
        run: ruff check .

      - name: Run tests
        # Unit tests only: LLM chains, the pgvector session, and the data warehouse
        # write are all mocked, so no Postgres/pgvector, Redis, or GOOGLE_API_KEY is
        # needed. conftest.py sets fake env vars before any app module is imported,
        # since a few modules build DB engines/API clients at import time.
        run: pytest tests -v

  integration:
    name: Integration tests
    # The same tests plus the ones that need a real Postgres and a real Redis: a run is not lost when the queue is down
    # or its worker is killed, an open circuit breaker recovers, a schedule starts its runs. They empty the tables of
    # the database they use, so they get a throwaway one. The images are the ones docker-compose.yml uses.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shdp_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHDP_INTEGRATION: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/shdp_it
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/shdp_it
      DATA_WAREHOUSE_URL: postgresql://postgres:postgres@localhost:5432/data_warehouse
      REDIS_URL: redis://localhost:6379/0
      # throwaway values, nothing here is a real secret and nothing calls the Gemini API
      API_KEY_SECRET: ci-api-key-secret
      ADMIN_SECRET_KEY: ci-admin-secret
      GOOGLE_API_KEY: not-a-real-key
      OTEL_TRACES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create the data warehouse database and apply the migrations
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE data_warehouse"
          alembic upgrade head

      - name: Run all tests, including the integration tests
        run: pytest tests -v

  images-and-chart:
    name: Images and Helm chart
    # Both images build, run as a non-root user, and the chart lints and renders with the migration hook, the probes and
    # the security settings. Nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: |
          docker build -f Dockerfile.control_plane -t shdp-cp:ci .
          docker build -f Dockerfile.worker -t shdp-worker:ci .

      - name: The images run as a non-root user
        run: |
          test "$(docker run --rm shdp-cp:ci id -u)" = "10001"
          test "$(docker run --rm shdp-worker:ci id -u)" = "10001"
          docker run --rm shdp-worker:ci python -c "import os, sys; sys.exit(0 if os.access('/app/data', os.W_OK) else 1)"

      - name: Lint and render the chart
        run: |
          ARGS="--set secrets.databaseUrl=postgresql+asyncpg://u:p@h/db --set secrets.databaseUrlSync=postgresql://u:p@h/db --set secrets.dataWarehouseUrl=postgresql://u:p@h/dw --set secrets.redisUrl=redis://r:6379/0 --set secrets.apiKeySecret=aaaaaaaaaaaaaaaaaaaa --set secrets.adminSecretKey=bbbbbbbbbbbbbbbbbbbb --set secrets.googleApiKey=k --set image.controlPlane.repository=cp --set image.worker.repository=wk"
          helm lint helm/shdp $ARGS
          helm template shdp helm/shdp $ARGS > rendered.yaml
          grep -q "helm.sh/hook.: pre-install,pre-upgrade" rendered.yaml
          grep -q "path: /ready" rendered.yaml
          grep -q "runAsNonRoot: true" rendered.yaml
          grep -q "terminationGracePeriodSeconds" rendered.yaml
          grep -q "ALLOW_PRIVATE_URLS: .false." rendered.yaml

  alerting-rules:
    name: Alerting rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Prometheus and Alertmanager config
        run: |
          docker run --rm -v "$PWD/observability:/o:ro" --entrypoint /bin/promtool \
            prom/prometheus:v3.13.3 check config /o/prometheus.yml
          docker run --rm -v "$PWD/observability:/o:ro" --entrypoint /bin/promtool \
            prom/prometheus:v3.13.3 check rules /o/rules/slo.rules.yml /o/rules/slo.alerts.yml
          docker run --rm -v "$PWD/observability:/o:ro" --entrypoint /bin/amtool \
            prom/alertmanager:v0.34.1 check-config /o/alertmanager.yml

      - name: Unit test the alert rules
        # Feeds synthetic series through the real rule files and checks what
        # fires. No running stack needed.
        run: |
          docker run --rm -v "$PWD/observability:/o:ro" --entrypoint /bin/promtool \
            prom/prometheus:v3.13.3 test rules /o/rules/tests/slo.test.yml

      - name: Check the Grafana dashboard is valid JSON
        run: python -m json.tool observability/grafana/dashboards/shdp-slo.json > /dev/null
